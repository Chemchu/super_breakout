[workspace]
resolver = "2"
members = [
  "app", 
  "core",
  "core/common",
  "core/input",
  "core/ball",
  "core/paddle",
  "core/wall",
  "core/game_ui",
  "core/game_orchestrator",
]

[workspace.dependencies]
bevy = {version = "0.19.0", features = ["debug"]}
bevy_input = {version = "0.19.0"}
bevy_enhanced_input = {version = "0.26.0"}
avian2d = {version = "0.7.0"}

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
